[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    live: hits the real Elexon API; deselect with -m "not live"
# Deprecations in our own code are failures. Third-party ones we cannot fix are
# ignored individually rather than by relaxing the rule.
filterwarnings =
    error::DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
