server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; the entry document never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The browser only ever talks to this origin: nginx forwards /api to the
    # backend container, so there is no cross-origin request and no CORS
    # preflight in the Compose setup.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold cache fetches a month of both datasets upstream.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
